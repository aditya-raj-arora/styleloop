name: Deploy

# Deploy skeleton. Real deploys can also be handled by Vercel/Railway native
# GitHub integrations (auto-deploy on push), in which case this workflow can be
# removed. Kept here to document the intended CD contract.
#
# Required GitHub secrets:
#   RAILWAY_TOKEN   - Railway project token (backend)
#   VERCEL_TOKEN    - Vercel token (frontend)
#   VERCEL_ORG_ID   - Vercel org id
#   VERCEL_PROJECT_ID - Vercel project id

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy backend (Railway)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard on missing secret
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN not set — skipping backend deploy (skeleton)."
            exit 0
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # TODO(Backend/Infra): install Railway CLI and deploy.
      #   npm i -g @railway/cli
      #   railway up --service backend
      - name: Deploy (placeholder)
        run: echo "TODO: railway up --service backend"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard on missing secret
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "VERCEL_TOKEN not set — skipping frontend deploy (skeleton)."
            exit 0
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # TODO(Frontend): install Vercel CLI and deploy.
      #   npm i -g vercel
      #   vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      #   vercel build --prod --token=$VERCEL_TOKEN
      #   vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
      - name: Deploy (placeholder)
        run: echo "TODO: vercel deploy --prebuilt --prod"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
