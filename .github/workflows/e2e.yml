name: E2E

# Runs the full stack for real: Postgres + Redis + MinIO (a local
# S3-compatible store, matching the storage adapter's real R2/S3 code path)
# + the backend API + the RQ worker + the frontend dev server, then drives
# it all with Playwright. See e2e/README.md for what this does and
# deliberately doesn't cover (no external API keys are configured here —
# bg-removal/tagging/try-on rendering stay "pending" by design; those
# services' own correctness is the backend unit tests' job).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: styleloop
          POSTGRES_PASSWORD: styleloop
          POSTGRES_DB: styleloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U styleloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://styleloop:styleloop@localhost:5432/styleloop
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: styleloop
      STORAGE_SECRET_KEY: styleloop123
      STORAGE_BUCKET: styleloop-media
      STORAGE_REGION: us-east-1
      JWT_SECRET: e2e-test-secret-not-for-production
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        # A plain `docker run`, not a job-level `services:` entry: the
        # official MinIO image needs an explicit `server /data` command to
        # actually start serving (bare `services:` in GitHub Actions can't
        # override a container's command/entrypoint). quay.io, not Docker
        # Hub: MinIO removed its Docker Hub images (Sept 2026) -
        # minio/minio now 401s on anonymous pulls with a misleading
        # "access denied"/"docker login" message; quay.io is their current
        # official distribution, same tags. Learned this the hard way on
        # this workflow's first real run.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=styleloop -e MINIO_ROOT_PASSWORD=styleloop123 \
            quay.io/minio/minio server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            echo "Waiting for MinIO ($i/20)..."
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create the MinIO bucket
        run: |
          python -c "
          import boto3
          from botocore.client import Config
          client = boto3.client(
              's3',
              endpoint_url='http://localhost:9000',
              aws_access_key_id='styleloop',
              aws_secret_access_key='styleloop123',
              region_name='us-east-1',
              config=Config(signature_version='s3v4', s3={'addressing_style': 'path'}),
          )
          try:
              client.create_bucket(Bucket='styleloop-media')
          except client.exceptions.BucketAlreadyOwnedByYou:
              pass
          "

      - name: Migrate the database
        working-directory: backend
        run: alembic upgrade head

      - name: Seed the demo user
        working-directory: backend
        run: python scripts/seed.py

      - name: Start the API
        working-directory: backend
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &

      - name: Start the worker
        working-directory: backend
        run: nohup python -m app.workers.run > worker.log 2>&1 &

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for the API ($i/30)..."
            sleep 1
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Start the frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: nohup npm run dev -- --port 5173 --host > frontend.log 2>&1 &

      - name: Wait for the frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && break
            echo "Waiting for the frontend ($i/30)..."
            sleep 1
          done

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "--- API log ---"; cat backend/api.log || true
          echo "--- Worker log ---"; cat backend/worker.log || true
          echo "--- Frontend log ---"; cat frontend/frontend.log || true
